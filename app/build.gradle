plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shiinobu.basara'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shiinobu.basara'
        // Guest RAM uses memfd_create, which bionic has from Android 11 (API 30).
        minSdk 30
        targetSdk 34
        versionCode 18
        versionName '0.2.2'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal builds: sign with the local debug key so the APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Release builds skip lint's vital checks: this machine builds offline, without lint's jars.
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // libmain.so and the runtime's data files are staged by tools/b-android.ps1 -Mode stage from
            // the native build (generated/android-build); they are not checked in.
            jniLibs.srcDirs = ['../generated/android-native/jniLibs']
            assets.srcDirs = ['../generated/android-native/assets']
        }
    }

    packagingOptions {
        jniLibs {
            // Keep libmain.so uncompressed and page-aligned in the APK so it is mapped in place.
            useLegacyPackaging false
        }
    }
}
